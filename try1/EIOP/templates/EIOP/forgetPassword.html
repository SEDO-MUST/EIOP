{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EIOP | Forgot Password</title>
    <link rel="stylesheet" href="{% static 'style.css' %}" >
    <link rel="stylesheet" href="{% static 'responsive.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="logo">
                <i class="fas fa-stream"></i>
		<h1>Enterprise Intelligence & Operations Platform  <span>EIOP</span></h1>

            </div>
            <p class="auth-sub">Reset your password</p>
            <div id="forgotError" class="auth-error"></div>
            <div id="forgotSuccess" class="auth-error" style="background:#d4edda;color:#155724;display:none;"></div>
            <form id="forgotForm">
                <div class="form-group">
                    <label for="forgotEmail"><i class="fas fa-envelope"></i> Email address</label>
                    <input type="email" id="forgotEmail" placeholder="you@example.com" required />
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary"><i class="fas fa-paper-plane"></i> Send Reset Link</button>
                </div>
                <div class="auth-footer">
                    Remember your password? <a href="/login">Log In</a>
                </div>
            </form>
        </div>
    </div>
    <script src="js-forgot.js"></script>
</body>
</html>
