{% extends "EIOP/base.html" %}
{% load static %}

{% block title %}
<title>EIOP | People Management</title>
{% endblock %}

{% block content %}
<main class="main-content"> 
<div class="people-container">
<div class="page-header">
    <h1><i class="fas fa-users-cog"></i> People Management</h1> 
    <button class="btn btn-primary" id="createUserBtn"> <i class="fas fa-user-plus"></i> Add User </button> 
</div>
 

    <!-- Filters -->

   <!-- Replace the filters-bar div -->
<div class="filters-bar row g-2 align-items-end mb-3">
    <div class="col-md-2">
        <input type="text" id="searchInput" placeholder="Search..." class="form-control form-control-sm">
    </div>
    <div class="col-md-2">
        <select id="roleFilter" class="form-select form-select-sm"><option value="">All Roles</option></select>
    </div>
    <div class="col-md-2">
        <select id="typeFilter" class="form-select form-select-sm"><option value="">All Types</option></select>
    </div>
    <div class="col-md-2">
        <select id="statusFilter" class="form-select form-select-sm"><option value="">All Status</option></select>
    </div>
    <div class="col-md-2">
        <select id="permissionFilter" class="form-select form-select-sm"><option value="">All Permissions</option></select>
    </div>
    <div class="col-md-2 d-flex gap-2">
        <button class="btn btn-secondary btn-sm w-50" id="resetFiltersBtn"><i class="fas fa-undo"></i> Reset</button>
        <button class="btn btn-primary btn-sm w-50" id="createUserBtnSmall"><i class="fas fa-user-plus"></i> Add</button>
    </div>
</div>

    <!-- Table -->

    <div
        id="userTableContainer"
        class="card shadow-sm">

        {% include "EIOP/partials/user_table.html" %}

    </div>

</div>


<!-- Request Modal -->

<div
    class="modal fade"
    id="requestModal"
    tabindex="-1">

    <div class="modal-dialog modal-lg">

        <div class="modal-content">

            <div class="modal-header">

                <h5
                    id="requestModalTitle"
                    class="modal-title">

                    New Request

                </h5>

                <button
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <div
                id="requestModalBody"
                class="modal-body">

            </div>

        </div>

    </div>

</div>


<!-- Profile Modal -->

<div
    class="modal fade"
    id="profileModal"
    tabindex="-1">

    <div class="modal-dialog modal-xl">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">

                    User Profile

                </h5>

                <button
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <div
                id="profileModalBody"
                class="modal-body">

            </div>

        </div>

    </div>

</div>


<!-- Toast -->

<div
    id="toastContainer"
    class="position-fixed top-0 end-0 p-3"
    style="z-index:1200">

</div>
</main >
{% endblock %}


{% block add %}
 
<script>

const PEOPLE_URLS = {
    search : "/hr/search/",
    createRequest : "/hr/request/create/",
    profile : "/hr/profile/",
    delete : "/hr/user/",
    restore : "/hr/user/",
    promote : "/hr/user/",
    demote : "/hr/user/",
    audit : "/hr/audit/",
    cancel: "/hr/request/",
    filterData: "/hr/filter-data/"
};

</script>

<script src="{% static 'js/people.js' %}"></script>


{% endblock %}
