
<form id="requestForm" action="{% url 'create_user_request' %}" method="post">
    {% csrf_token %}
    <div class="mb-3">
        <label for="user_type" class="form-label">User Type</label>
        <select name="user_type" id="user_type" class="form-select" required>
            <option value="STAFF">Staff</option>
            <option value="MANAGER">Manager</option>
            <option value="ORG_ADMIN">Organization Admin</option>
        </select>
    </div>
    <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" name="username" id="username" class="form-control">
    </div>
    <div class="mb-3">
        <label for="name" class="form-label">Full Name</label>
        <input type="text" name="name" id="name" class="form-control" required>
    </div>
    <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" name="email" id="email" class="form-control" required>
    </div>
    <div class="mb-3">
        <label for="phoneNumber" class="form-label">Phone</label>
        <input type="text" name="phoneNumber" id="phoneNumber" class="form-control">
    </div>
    <div class="mb-3">
        <label for="gender" class="form-label">Gender</label>
        <select name="gender" id="gender" class="form-select">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
        </select>
    </div>
    <div class="mb-3">
        <label for="dateOfBirth" class="form-label">Date of Birth</label>
        <input type="date" name="dateOfBirth" id="dateOfBirth" class="form-control">
    </div>
    <div class="mb-3">
        <label for="specialization" class="form-label">Specialization</label>
        <input type="text" name="specialization" id="specialization" class="form-control">
    </div>
    <div class="mb-3">
        <label for="note" class="form-label">Note</label>
        <textarea name="note" id="note" class="form-control" rows="2"></textarea>
    </div>
    <div class="mb-3">
        <label for="account" class="form-label">Account</label>
        <input type="text" name="account" id="account" class="form-control">
    </div>
    <!-- Fields for Manager -->
    <div id="managerFields" style="display:none;">
        <div class="mb-3">
            <label for="rank" class="form-label">Rank</label>
            <select name="rank" id="rank" class="form-select">
                {% for rank in ranks %}
                <option value="{{ rank }}">{{ rank }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label for="management_type" class="form-label">Management Type</label>
            <input type="text" name="management_type" id="management_type" class="form-control">
        </div>
    </div>
    <!-- Fields for Staff -->
    <div id="staffFields" style="display:none;">
        <div class="mb-3">
            <label for="field" class="form-label">Field</label>
            <input type="text" name="field" id="field" class="form-control">
        </div>
        <div class="mb-3">
            <label for="direct_manager" class="form-label">Direct Manager</label>
            <select name="direct_manager" id="direct_manager" class="form-select">
                <option value="">None</option>
                {% for manager in managers %}
                <option value="{{ manager.id }}">{{ manager.name }}</option>
                {% endfor %}
            </select>
        </div>
    </div>
    <div class="mb-3">
        <label class="form-label">Permissions</label>
        <select name="permissions" multiple class="form-select">
            {% for perm in permissions %}
            <option value="{{ perm.id }}">{{ perm.name }}</option>
            {% endfor %}
        </select>
        <small class="text-muted">Hold Ctrl to select multiple.</small>
    </div>
    <button type="submit" class="btn btn-primary">Submit Request</button>
</form>

<script>
    // Show/hide fields based on user type
    document.getElementById('user_type').addEventListener('change', function() {
        const type = this.value;
        document.getElementById('managerFields').style.display = (type === 'MANAGER') ? 'block' : 'none';
        document.getElementById('staffFields').style.display = (type === 'STAFF') ? 'block' : 'none';
    });
    // Trigger on load
    document.getElementById('user_type').dispatchEvent(new Event('change'));
</script>
